# Project-wide Gradle settings for FamilyTweaks.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX is required for all modern Android library dependencies.
android.useAndroidX=true

# Only keep resources that are actually used by the app.
android.nonTransitiveRClass=true

# Kotlin code style for this project: official.
kotlin.code.style=official
